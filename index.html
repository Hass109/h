<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hassoun&Gaming</title>
<link rel="stylesheet" href="style.css">

<style>
  /* إعدادات الشاشة الكاملة والخلفية */
  html, body { 
    margin:0; 
    padding:0; 
    background: url('preview.png') no-repeat center center fixed; 
    background-size: cover;
    color:#97b4de;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* حاوية المحتوى الرئيسي وتوسيطها أفقياً */
  #main-container {
    display: flex;
    flex-direction: column;
    align-items: center; 
    height: 100vh;
    box-sizing: border-box;
    padding: 15px 30px; 
  }

  /* الهيدر العلوي */
  #brand { 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5px 0;
    background: transparent !important; 
    border: none !important;
    margin-bottom: 10px; 
  }
  #brand img { 
    width: 44px; 
    height: 44px; 
    margin-bottom: 6px; 
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  
  /* الاسم باللون الأحمر */
  #brand .title-main { 
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 38px !important; 
    font-weight: 900; 
    text-transform: uppercase;
    color: #f50707; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(0,0,0,0.9);
    margin: 0;
  }

  /* الرقم باللون الأخضر */
  #brand .title-sub {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 26px !important; 
    font-weight: 900;
    color: #00572c; 
    text-shadow: 0 0 8px rgba(255, 215, 64, 0.4), 0 2px 5px rgba(0,0,0,0.9);
    margin-top: 2px; 
  }

  /* الفوتر السفلي */
  .footer {
    text-align: center;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    padding: 8px 0;
    font-size: 12px;
    color: #5c6672; 
    background: rgba(14, 17, 22, 0.35); 
    border-top: 1px solid #1e2732;
    box-sizing: border-box;
    z-index: 10;
  }

  .footer strong { 
    color: #8b95a3; 
    font-weight: 700;
    display: inline-block;
    margin: 1px 0;
  }

  .footer span {
    display: block;
    font-size: 11px;
    color: #8b95a3; 
    margin-top: 2px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* حاوية التغليف المحمية للسكربت */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center; 
    justify-content: flex-start;
    width: 100%;
    flex: 1;
    overflow: hidden;
    margin-top: 10px;
  }

  /* التفاصيل والتعليمات للمستخدم */
  #details { 
    font-size: 13px; 
    color: #ffffff; 
    margin-bottom: 12px; 
    text-align: center;
    font-weight: normal;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #details b { color: #ffd740; font-weight: bold; }

  /* حالة النظام الحالية الناعمة */
  #state { 
    font-size: 13px; 
    font-weight: normal; 
    margin-bottom: 12px; 
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* لوحة إخراج الأكواد المصغرة والموسطة */
  #out { 
    width: 75%; 
    max-width: 650px;
    height: 110px !important;     /* الارتفاع المطلوب */
    min-height: 110px !important; /* يمنع تقلص المربع */
    max-height: 110px !important; /* يمنع تمدد المربع لأسفل نهائياً */
    flex: none !important;
    white-space: pre-wrap; 
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11px; 
    line-height: 1.4; 
    background: rgba(10, 14, 23, 0.45); 
    border: 1px solid rgba(255, 255, 255, 0.15); 
    border-radius: 8px;
    padding: 10px 15px; 
    overflow-y: auto !important;
    overflow-x: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
    margin-top: 4px; 
    margin-bottom: 0px; 
    text-align: center;
    box-sizing: border-box;
  }
  
  /* تخصيص مظهر شريط التمرير */
  #out::-webkit-scrollbar {
    width: 5px;
  }
  #out::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 3px;
  }
  #out::-webkit-scrollbar-thumb {
    background: #ffd740; 
    border-radius: 3px;
  }

  /* ألوان الحالات المتوهجة للأكواد */
  .ok { color: #69f0ae; } 
  .bad { color: #ff5252; } 
  .warn { color: #ffd740; text-shadow: none !important; font-weight: normal; }
</style>
</head>
<body>

<div id="main-container">
  <!-- الهيدر الملون -->
  <div id="brand">
    <img src="logo_raw.png" alt="" width="44" height="44">
    <div class="title-main">Hassoun & Gaming</div>
    <div class="title-sub">0123783040</div>
  </div>

  <!-- حاوية الـ wrap -->
  <div id="wrap">
    <div id="state" class="warn">Loading GoldHEN v2.4b18.10... Please Wait</div>
    <div id="details">حالة المتصفح: يرجى الانتظار حتى يتم فحص إصدار النظام وتفعيل الملفات <b></b> تلقائياً.</div>
    <div id="out">جاري فحص الجيلبريك المناسب لجهازك...</div>
  </div>
  
  <!-- الفوتر السفلي -->
  <div class="footer">
    ...موقعنا<br>
    <strong>دنقلا - السوق الكبير - تقاطع زين سابقا - ديف تكنولوجي</strong><br>
    <span>PS2 PS3 PS4 PS5 تعديل وتنزيل العاب</span>
  </div>
</div>

<!-- منطق التنفيذ والتحويل الأصلي والمستقر لـ GamerHack دون تداخل -->
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown"; 
var fwNum = parseFloat(fwVersion);

var stateBox = document.getElementById("state");
var outBox = document.getElementById("out");

function onScriptError() {
    stateBox.innerHTML = "ERROR!";
    stateBox.className = "bad";
    outBox.innerHTML = "<span class='bad'>Content not Found! - Clear Browser Data and Re-Install Cache ...</span>";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        stateBox.innerHTML = "PC / MOBILE DETECTED";
        stateBox.className = "warn";
        outBox.innerHTML = "<span class='warn'>Only for PS4 with Firmware 7.00 to 13.00</span>";
    });
} else {
    // 1. التحقق مما إذا كان الجهاز متصلاً بالإنترنت (أوفلاين)
    if (!navigator.onLine) {
        // نحن في وضع الأوفلاين: يمنع التحويل، وننفذ الثغرة فوراً من الملفات المخبأة
        executePayload();
    } else {
        // 2. نحن في وضع الأونلاين: نقرأ حالة الكاش
        var cacheStatus = window.applicationCache ? window.applicationCache.status : 0;
        
        // التحقق إذا كنا في الصفحة الرئيسية (الرابط لا يحتوي على كلمة cache)
        if (!window.location.href.includes('cache')) {
            
            // إذا كان الكاش غير موجود أبداً (0)، قم بتحويله لصفحة حفظ الكاش المخصصة لإصداره
            if (cacheStatus === 0) {
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    window.location.replace("cache700.html");
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    window.location.replace("cache900.html");
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    window.location.replace("cachecss.html");
                } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                    window.location.replace("cacheslopkit.html");
                } else {
                    stateBox.innerHTML = "UNSUPPORTED FIRMWARE";
                    stateBox.className = "bad";
                    outBox.innerHTML = 'Firmware Version: <span style="color: red;">' + fwVersion + '</span> is not supported.';
                }
            } else if (cacheStatus === 1) {
                // (1) تعني IDLE (الكاش موجود ومُحدث بالكامل مسبقاً)، نفذ الثغرة مباشرة
                executePayload();
            }
            // إذا كانت الحالة (2 أو 3) تعني أنه جاري تحميل الكاش الآن، ننتظر ولا ننفذ الثغرة حتى لا نتعارض مع التحميل
            
        } else {
            // نحن الآن داخل صفحة من صفحات الكاش نفسها (مثل cache900.html)
            executePayload();
        }
    }
}

// دالة منفصلة ومحمية لاستدعاء الثغرة والملفات بعد نجاح التحقق والتثبيت الكاش
function executePayload() {
    if (fwNum >= 7.00 && fwNum <= 8.52) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "700/alert.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 9.00 && fwNum <= 9.60) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "900/alert.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 10.00 && fwNum <= 11.02) {
        var script = document.createElement('script');
        script.src = "css/main.js";
        script.onerror = onScriptError;
        script.onload = function () {
            setTimeout(function () {
                if(typeof doJb === "function") doJb();
            }, 500);
        };
        document.head.appendChild(script);
    }
    else if (fwNum >= 11.50 && fwNum <= 12.02) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "slopkit/chain_lapse.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
    else if (fwNum >= 12.50 && fwNum <= 13.00) {
        var script = document.createElement('script');
        script.type = 'module';
        script.src = "slopkit/chain_poops.js";
        script.onerror = onScriptError;
        document.head.appendChild(script);
    }
}
</script>

</body>
</html>
