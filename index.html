<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hassoun&Gaming</title>
<link rel="stylesheet" href="../style.css">

<style>
  /* إعدادات الشاشة الكاملة والخلفية */
  html, body { 
    margin:0; 
    padding:0; 
    background: url('preview.png') no-repeat center center fixed; 
    background-size: cover;
    color:#97b4de;
    font-family: 'Arial Black', 'Impact', 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* حاوية المحتوى الرئيسي */
  #main-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    padding: 20px 30px;
  }

  /* الهيدر العلوي: شفاف تماماً وبخط ضخم جداً وعريض */
  #brand { 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    background: transparent !important; 
    border: none !important;
    margin-bottom: 20px;
  }
  #brand img { 
    width: 48px; 
    height: 48px; 
    margin-bottom: 8px; 
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  
  /* السطر الأول (الاسم باللون الأحمر) */
  #brand .title-main { 
    font-size: 40px !important; 
    font-weight: 900; 
    text-transform: uppercase;
    color: #f50707; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(0,0,0,0.9);
    margin: 0;
  }

  /* السطر الثاني (الرقم باللون الأخضر) */
  #brand .title-sub {
    font-size: 30px !important; 
    font-weight: 900;
    color: #00572c; 
    text-shadow: 0 0 8px rgba(255, 215, 64, 0.4), 0 2px 5px rgba(0,0,0,0.9);
    margin-top: 4px; 
  }

  .footer {
    text-align: center;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    padding: 10px 0;
    font-size: 13px;
    color: #5c6672; 
    background: rgba(14, 17, 22, 0.25); 
    border-top: 1px solid #1e2732;
    box-sizing: border-box;
    z-index: 10;
  }

  .footer strong { 
    color: #8b95a3; 
    font-weight: 700;
    display: inline-block;
    margin: 1px 0;
  }

  .footer span {
    display: block;
    font-size: 11px;
    color: #8b95a3; 
    margin-top: 3px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* حاوية التغليف المحمية */
  #wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  /* التفاصيل والتعليمات */
  #details { 
    font-size: 13px; 
    color: #ffffff; 
    margin-bottom: 10px; 
    text-align: center;
    font-weight: bold;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  }
  #details b { color: #ffd740; font-weight: 900; }

  /* حالة النظام الحالية بتأثير النيون المتوهج */
  #state { 
    font-size: 16px; 
    font-weight: 600; 
    margin-bottom: 12px; 
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* لوحة إخراج الأكواد */
  #out { 
    width: 85%; /* جعل العرض محدد بنسبة 85% بدلاً من كامل الشاشة لتصغيره وتناسقه */
    max-width: 650px; /* وضع حد أقصى للعرض لحمايته على الشاشات الكبيرة */
    height: 120px; /* تحديد ارتفاع ثابت ومصغر بدلاً من التمدد العشوائي */
    white-space: pre-wrap; 
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11px; 
    line-height: 1.4; 
    background: rgba(10, 14, 23, 0.4); /* تغميق الخلفية قليلاً لبروز النص */
    border: 1px solid rgba(255, 255, 255, 0.15); 
    border-radius: 10px;
    padding: 10px 15px; 
    overflow-y: auto; 
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
    margin-bottom: 55px; /* ترك مساحة كافية للفوتر السفلي */
    text-align: center;
    box-sizing: border-box;
  }
  }

  /* ألوان الحالات المتوهجة للأكواد */
  .ok { color: #69f0ae; text-shadow: 0 0 8px rgba(105,240,174,0.5); } 
  .bad { color: #ff5252; text-shadow: 0 0 8px rgba(255,82,82,0.5); } 
  .warn { color: #ffd740; text-shadow: 0 0 8px rgba(255,215,64,0.5); }
</style>
</head>
<body>

<div id="main-container">
  <!-- الهيدر الملون -->
  <div id="brand">
    <img src="logo_raw.png" alt="" width="48" height="48">
    <div class="title-main">Hassoun & Gaming</div>
    <div class="title-sub">0123783040</div>
  </div>

  <!-- حاوية الـ wrap المحمية المتناسقة مع التصميم الجديد -->
  <div id="wrap">
    <div id="state" class="warn">Loading GoldHEN v2.4b18.10... Please Wait</div>
    <div id="details">حالة المتصفح: يرجى الانتظار حتى يتم فحص إصدار النظام وتفعيل ملفات الـ <b>Exploit</b> تلقائياً.</div>
    <div id="out">جاري فحص الجيلبريك المناسب لجهازك...</div>
  </div>
  
  <!-- الفوتر السفلي الخاص بموقعك وعملك -->
  <div class="footer">
    موقعنا...<br>
    <strong>دنقلا - السوق الكبير - تقاطع زين سابقا - ديف تكنولوجي</strong><br>
    <span>تعديل وتنزيل العاب PS2 PS3 PS4 PS5</span>
  </div>
</div>

<!-- السكربت الأصلي لـ GamerHack مع ربطه بالتصميم الجديد -->
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

// ربط المخرجات بعناصر الواجهة الجديدة لتبسيط العرض
var stateBox = document.getElementById("state");
var outBox = document.getElementById("out");

function onScriptError() {
    stateBox.innerHTML = "ERROR!";
    stateBox.className = "bad";
    outBox.innerHTML = "<span class='bad'>Content not Found! - Clear Browser Data and Re-Install Cache ...</span>";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        stateBox.innerHTML = "PC / MOBILE DETECTED";
        stateBox.className = "warn";
        outBox.innerHTML = "<span class='warn'>Only for PS4 with Firmware 7.00 to 13.00</span>";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                stateBox.innerHTML = "UNSUPPORTED FIRMWARE";
                stateBox.className = "bad";
                outBox.innerHTML = 'Firmware Version: <span style="color: red;">' + fwVersion + '</span> is not supported.';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

</body>
</html>
