<!DOCTYPE html>
<html manifest="700.manifest">
<head>
    <meta charset="UTF-8">
    <title>Hassoun&amp;Gaming</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
        }
        hr {
            width: 40%;
            margin: 10px auto;
        }
        #msgs {
            font-size: 26px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Hassoun&amp;Gaming</h1>
    <hr>
    <h1 id="msgs">Starting Cache Installation...</h1>

    <script>
        // تنظيف مسار الصفحة دون كسر سجل المتصفح
        if (window.history.replaceState) {
            window.history.replaceState(null, null, 'index.html');
        }

        var msgs = document.getElementById("msgs");

        function DLProgress(e) {
            if (e.lengthComputable) {
                var percent = Math.round((e.loaded / e.total) * 100);
                msgs.innerHTML = "Installing Offline Cache: " + percent + "%";
            }
        }

        function DisplayCacheProgress() {
            msgs.innerHTML = "Cache Installed Successfully ✔";
            setTimeout(function() {
                msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
            }, 1500);
        }

        if (window.applicationCache) {
            window.applicationCache.addEventListener("progress", DLProgress, false);
            window.applicationCache.oncached = DisplayCacheProgress;
            window.applicationCache.onupdateready = DisplayCacheProgress;
            window.applicationCache.onerror = function() {
                msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
            };
        }
    </script>
</body>
</html>
